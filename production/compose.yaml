services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: comsflow
      POSTGRES_USER: comsflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD securely}
    volumes:
      - comsflow_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U comsflow -d comsflow']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    env_file: .env.local
    environment:
      NODE_ENV: production
      DEV_AUTH: 'false'
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Use PostgreSQL hostname postgres with securely encoded credentials}
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  comsflow_data:
