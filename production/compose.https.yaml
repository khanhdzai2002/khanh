services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: comsflow
      POSTGRES_USER: comsflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}
    volumes:
      - comsflow_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U comsflow -d comsflow']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    image: comsflow-production:local
    env_file: .env.production
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${APP_DOMAIN:?Set the real DNS hostname}
      DEV_AUTH: 'false'
    command: [npm, run, migrate]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  app:
    image: comsflow-production:local
    env_file: .env.production
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${APP_DOMAIN:?Set the real DNS hostname}
      DEV_AUTH: 'false'
      HOST: 0.0.0.0
      PORT: 3001
    expose:
      - '3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  https:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set the real DNS hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  comsflow_data:
  caddy_data:
  caddy_config:
